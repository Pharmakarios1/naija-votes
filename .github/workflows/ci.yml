name: CI
on:
  pull_request:
  workflow_call: # deploy.yml calls this, so nothing ships unless CI passes
jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d && sleep 25
      - name: Smoke test
        run: |
          curl -sf http://localhost:8080/api/results | grep -q '"total"'
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"state":"Lagos","party":"LP"}' http://localhost:8080/api/vote
      - if: always()
        run: docker compose logs && docker compose down -v
