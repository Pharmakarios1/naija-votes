name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  PROJECT: naija-vote

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        app: [api, web, simulator]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/task-definition-${{ matrix.app }}.json
          container-name: ${{ matrix.app }}
          image: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.PROJECT }}-${{ matrix.app }}:${{ github.sha }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.PROJECT }}
          service: ${{ matrix.app }}
          wait-for-service-stability: true

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: jtalk/url-health-check-action@v4
        with:
          url: ${{ vars.APP_URL }}/health|${{ vars.APP_URL }}/api/results
          max-attempts: 5
          retry-delay: 5s