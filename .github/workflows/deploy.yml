name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # lets the job request a GitHub OIDC token
  contents: read

concurrency:
  group: deploy        # never run two deploys at once
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1   # keep in sync with terraform var.region
  PROJECT: naija-vote     # keep in sync with terraform var.name

jobs:
  ci:
    uses: ./.github/workflows/ci.yml   # build + smoke test must pass first

  deploy:
    needs: ci
    runs-on: ubuntu-latest   # x86, which matches the Fargate tasks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 1. Fail fast, with a readable message, if a repository variable is missing
      - name: Preflight - variables
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          URL: ${{ vars.APP_URL }}
        run: |
          [ -n "$ROLE" ] || { echo "::error::Repository variable AWS_DEPLOY_ROLE_ARN is empty (Settings > Secrets and variables > Actions > Variables)"; exit 1; }
          [ -n "$URL" ]  || { echo "::error::Repository variable APP_URL is empty"; exit 1; }

      # 2. Read-only diagnosis: what identity does GitHub present to AWS? (the token itself is never printed)
      - name: Preflight - OIDC identity report
        continue-on-error: true
        run: |
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          CLAIMS=$(python3 - "$TOKEN" <<'PY'
          import sys, base64
          p = sys.argv[1].split('.')[1]
          p += '=' * (-len(p) % 4)
          print(base64.urlsafe_b64decode(p).decode())
          PY
          )
          SUB=$(jq -r .sub <<< "$CLAIMS"); AUD=$(jq -r .aud <<< "$CLAIMS")
          echo "sub = $SUB"; echo "aud = $AUD"
          {
            echo "### OIDC identity report"
            echo "- Token subject (sub): \`$SUB\`"
            echo "- Audience (aud): \`$AUD\`"
            echo "- Exact repo spelling: \`$GITHUB_REPOSITORY\`"
            echo ""
            echo "AWS trusts this role only if its trust policy contains exactly \`$SUB\`. If login fails, run:"
            echo '```'
            echo "terraform apply -var github_repo=$GITHUB_REPOSITORY -var alert_email=YOU@EXAMPLE.COM"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 3. Exchange the GitHub token for temporary AWS credentials
      - id: creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Who am I?
        run: aws sts get-caller-identity

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images (skipped if this commit was already built)
        env:
          REG: ${{ steps.ecr.outputs.registry }}
        run: |
          build() {  # usage: build <app> <dir> [extra docker args]
            if aws ecr describe-images --repository-name "$PROJECT/$1" --image-ids imageTag="$GITHUB_SHA" > /dev/null 2>&1; then
              echo "$1 @ $GITHUB_SHA already exists, reusing"; return
            fi
            docker build -t "$REG/$PROJECT/$1:$GITHUB_SHA" "${@:3}" "$2"
            docker push "$REG/$PROJECT/$1:$GITHUB_SHA"
          }
          build api backend
          build web frontend --build-arg NGINX_CONF=nginx.ecs.conf
          build simulator simulator

      - name: Roll out (new task-definition revision per service, pinned to this commit)
        env:
          REG: ${{ steps.ecr.outputs.registry }}
        run: |
          for svc in api web simulator; do
            TD=$(aws ecs describe-task-definition --task-definition "$PROJECT-$svc" --query taskDefinition --output json)
            # keep only fields register-task-definition accepts, then swap in this commit's image
            NEW=$(jq --arg svc "$svc" --arg img "$REG/$PROJECT/$svc:$GITHUB_SHA" '
              {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions, volumes,
               placementConstraints, requiresCompatibilities, cpu, memory, runtimePlatform,
               ephemeralStorage, pidMode, ipcMode}
              | with_entries(select(.value != null))
              | (.containerDefinitions[] | select(.name == $svc) | .image) = $img' <<< "$TD")
            ARN=$(aws ecs register-task-definition --cli-input-json "$NEW" --query taskDefinition.taskDefinitionArn --output text)
            aws ecs update-service --cluster "$PROJECT" --service "$svc" --task-definition "$ARN" > /dev/null
            echo "$svc -> $ARN"
          done
          aws ecs wait services-stable --cluster "$PROJECT" --services api web simulator

      - name: Smoke test (retries while the load balancer warms up)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl -sf --retry 10 --retry-delay 6 --retry-all-errors "$APP_URL/health"
          curl -sf --retry 10 --retry-delay 6 --retry-all-errors "$APP_URL/api/results" | grep -q '"total"'

      - name: Show recent ECS events (only on failure)
        if: failure() && steps.creds.outcome == 'success'
        run: |
          for svc in api web simulator; do
            echo "== $svc"
            aws ecs describe-services --cluster "$PROJECT" --services "$svc" \
              --query 'services[0].events[:5].message' --output text || true
          done