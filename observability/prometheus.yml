global:
  scrape_interval: 15s      # how often Prometheus PULLS metrics from each target
scrape_configs:
  - job_name: api
    metrics_path: /metrics
    dns_sd_configs:         # service discovery: one target per API replica, found via DNS
      - names: [api]
        type: A
        port: 4000
  - job_name: prometheus    # Prometheus monitors itself too
    static_configs:
      - targets: ['localhost:9090']
