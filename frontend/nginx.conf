upstream api { server api:4000; }      # Docker DNS load-balances across API replicas
server {
  listen 80;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;               # required for live SSE
    proxy_read_timeout 1h;
  }
}
